spring:
  application:
    name: satellite-ai
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:satellite_ai}
    username: ${POSTGRES_USER:satellite}
    password: ${POSTGRES_PASSWORD:satellite}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${SPRING_AI_OLLAMA_CHAT_MODEL:qwen3:4b}
          temperature: ${SPRING_AI_OLLAMA_TEMPERATURE:0.1}
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

app:
  python:
    base-url: ${PYTHON_AI_BASE_URL:http://localhost:8000}
    connect-timeout: 2s
    read-timeout: 300s
  minio:
    enabled: ${MINIO_ENABLED:true}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:satellite-images}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} correlationId=%X{correlationId:-none} - %msg%n"
