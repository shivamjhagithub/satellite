spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:satellite_ai_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  python:
    base-url: http://127.0.0.1:9
    connect-timeout: 200ms
    read-timeout: 200ms
  minio:
    enabled: false
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test
    bucket: satellite-images
